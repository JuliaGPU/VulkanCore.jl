# The driver comes from the distribution: Mesa's lavapipe is a software Vulkan
# implementation, so a runner with no GPU still has something to create an
# instance against. This used to download the LunarG SDK, and LunarG stopped
# serving the pinned 1.3.239.0 build -- every job failed on a 404 before Julia
# was even installed.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Julia ${{ matrix.julia-version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['lts', '1', 'nightly']
        os: [ubuntu-latest]
        include:
          # No Vulkan driver on purpose. A machine without one must still be able
          # to load this package, which is what `HAS_LOADER` is for, and macOS is
          # where that case is actually met.
          - julia-version: '1'
            os: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: serenity4/julia-lavapipe@v1
        if: runner.os == 'Linux'
      - name: Start a virtual display for GLFW
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb
          Xvfb :99 &
          echo "DISPLAY=:99" >> $GITHUB_ENV
      - uses: julia-actions/setup-julia@latest
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@latest
      - uses: julia-actions/julia-runtest@latest
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
