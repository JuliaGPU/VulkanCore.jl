# The driver comes from the distribution rather than from LunarG, whose pinned
# 1.3.239.0 SDK is a 404 now -- every job used to fail on that before Julia was
# even installed. Linux gets Mesa's lavapipe, a software implementation, so a
# runner with no GPU still has something to create an instance against; macOS
# gets MoltenVK, which is how Vulkan is meant to be reached there.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Julia ${{ matrix.julia-version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['lts', '1', 'nightly']
        os: [ubuntu-latest]
        include:
          - julia-version: '1'
            os: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: serenity4/julia-lavapipe@v1
        if: runner.os == 'Linux'
      - name: Start a virtual display for GLFW
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb
          Xvfb :99 &
          echo "DISPLAY=:99" >> $GITHUB_ENV

      - name: Install MoltenVK, the loader and the validation layers
        if: runner.os == 'macOS'
        run: |
          brew install molten-vk vulkan-loader vulkan-validationlayers
          # Homebrew puts the ICD manifest under etc, not the share/vulkan/icd.d the
          # rest of the world uses. Checked rather than assumed: a wrong path here is
          # indistinguishable from having no driver at all, which reads as
          # VK_ERROR_INCOMPATIBLE_DRIVER several minutes later.
          icd="$(brew --prefix molten-vk)/etc/vulkan/icd.d/MoltenVK_icd.json"
          test -f "$icd"
          echo "VK_DRIVER_FILES=$icd" >> $GITHUB_ENV
          echo "VK_LAYER_PATH=$(brew --prefix vulkan-validationlayers)/share/vulkan/explicit_layer.d" >> $GITHUB_ENV
          # GLFW looks the loader up by name, and Homebrew's lib directory is not on
          # dyld's default search path.
          echo "DYLD_FALLBACK_LIBRARY_PATH=$(brew --prefix vulkan-loader)/lib:$HOME/lib:/usr/local/lib:/lib:/usr/lib" >> $GITHUB_ENV
          # The loader answers "layer not present" for a manifest it found and a library
          # it could not load; only it knows which.
          echo "VK_LOADER_DEBUG=layer,error,warn" >> $GITHUB_ENV
          ls -l "$(brew --prefix vulkan-validationlayers)/share/vulkan/explicit_layer.d" "$(brew --prefix vulkan-validationlayers)/lib"
          cat "$(brew --prefix vulkan-validationlayers)/share/vulkan/explicit_layer.d/"*.json
          # Homebrew's lib directory is not on dyld's default search path, so the
          # loader has to be named outright. A preference rather than
          # JULIA_VULKAN_LIBNAME because only the preference is part of the
          # precompile hash -- an env var loses to a restored package cache. Pkg.test
          # copies this into the test sandbox.
          cat > LocalPreferences.toml <<EOF
          [VulkanCore]
          libvulkan = "$(brew --prefix vulkan-loader)/lib/libvulkan.1.dylib"
          EOF
          cat LocalPreferences.toml

      - uses: julia-actions/setup-julia@latest
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@latest
      - uses: julia-actions/julia-runtest@latest
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
